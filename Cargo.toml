[package]
name = "mpvctl"
version = "1.0.0"
edition = "2024"
description = "Control a long running mpv music daemon from the command line"

[workspace]

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
unwrap_used = "warn"
unwrap_in_result = "warn"

[lints]
workspace = true

[dependencies]
crossterm = "0.29.0"
libc = "0.2"
ratatui = "0.30.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1"
toml = "1.1.6"
